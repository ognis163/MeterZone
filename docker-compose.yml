# MeterZone на Synology DSM / любом Linux с Docker.
#
# ВАЖНО: перед первым запуском создайте рядом с этим файлом папку data —
# Synology не создаёт её автоматически, и контейнер упадёт с ошибкой
#   Bind mount failed: '/volume1/.../data' does not exist
#
# Образ уже готов и скачивается с GitHub: компилировать нечего.
# Этот же файл лежит в репозитории ognis163/meterzone-dist.

services:
  meterzone:
    image: ghcr.io/ognis163/meterzone-dist:latest
    restart: unless-stopped

    ports:
      - "8099:8099"

    environment:
      # Часовой пояс — замените на свой, если он другой.
      TZ: Europe/Astrakhan
      APP_TZ: Europe/Astrakhan

      HOST: 0.0.0.0
      PORT: "8099"

      # База и копии — в томе /data (он ниже смонтирован на ./data).
      APP_DB: /data/meterzone.db
      APP_BACKUP_DIR: /data/backups

      # Порт задаётся здесь, а не из интерфейса приложения.
      PORT_FIXED: "1"

      # Раскомментируйте для доступа не только из локальной сети.
      # ALLOW_PUBLIC: "1"

    # Папка data должна существовать заранее (см. заголовок файла).
    volumes:
      - ./data:/data

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8099/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
