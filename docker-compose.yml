# MeterZone на Synology DSM (Container Manager).
#
# 1. Положите папку проекта в /volume1/docker/meterzone
# 2. Container Manager → Проект → Создать → путь /volume1/docker/meterzone
# 3. Готово: http://<адрес NAS>:8099
#
# База и резервные копии остаются в ./data рядом с этим файлом
# и не теряются при пересборке и обновлении образа.

services:
  meterzone:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped

    ports:
      - "8099:8099"

    environment:
      # Часовой пояс. Замените на свой, если он другой.
      TZ: Europe/Astrakhan
      APP_TZ: Europe/Astrakhan

      HOST: 0.0.0.0
      PORT: "8099"

      # База и копии — в томе /data (он ниже смонтирован на ./data).
      APP_DB: /data/meterzone.db
      APP_BACKUP_DIR: /data/backups

      # В контейнере порт меняется только здесь, а не из интерфейса:
      # иначе приложение «уедет» на порт, который наружу не проброшен.
      PORT_FIXED: "1"

      # Раскомментируйте, если нужен доступ не из локальной сети
      # (например, через внешний адрес или VPN с публичным IP).
      # ALLOW_PUBLIC: "1"

    volumes:
      - ./data:/data

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8099/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
